function showPCol(id){const p=PROJECTS.find(x=>x.id===id);let x=document.getElementById('pcols');x.classList.remove('hidden');let items=info(p);x.innerHTML='<div class="heading"><h2>Colunas nesta prancha</h2><small>'+items.length+' identificações</small></div><input id="psearch" class="input no-print" placeholder="Buscar TP18, TG14, TE6..." oninput="searchPCol(this.value,\''+id+'\')"><div id="pentries"></div>';searchPCol('',id)}function searchPCol(q,id){let entries=info(PROJECTS.find(x=>x.id===id)).filter(x=>(x.codigo+' '+x.sistema).toLowerCase().includes(q.toLowerCase()));document.getElementById('pentries').innerHTML=entries.map(x=>'<div class="item"><div class="row"><div><span class="code">'+safe(x.codigo)+'</span><br><span class="muted">'+safe(x.sistema)+'</span></div><span class="badge">Ø '+safe(x.diametro)+' mm*</span></div></div>').join('')+'<p class="muted">* Valores conforme levantamento preliminar; símbolos †, ? e — indicam necessidade de confirmação na planta.</p>'}
function renderCols(){app.innerHTML=card('<div class="heading"><h2>Catálogo de colunas</h2><span class="pill">125 códigos</span></div><input class="input" id="search" placeholder="Código ou sistema: TP18, TA, dreno..." value="'+safe(filter)+'" oninput="filter=this.value;fillCols()"><div style="height:12px"></div><div id="catalog"></div>');fillCols()}function fillCols(){const found=COLS.filter(x=>(x.codigo+' '+x.sistema+' '+x.diametro).toLowerCase().includes(filter.toLowerCase()));document.getElementById('catalog').innerHTML='<div class="count">'+found.length+' resultado(s)</div>'+found.map(x=>'<div class="item"><div class="row"><div><span class="code">'+safe(x.codigo)+'</span><br><span class="muted">'+safe(x.sistema)+' • Ø '+safe(x.diametro)+' mm</span><br><small class="muted">'+(x.pranchas.length?x.pranchas.map(v=>'ESG-'+v).join(' • '):'Sem prancha registrada')+'</small></div><button class="btn ghost" style="padding:8px" onclick="editCol(\''+x.codigo+'\')">Ver</button></div></div>').join('')}
function diameterText(v){let s=String(v||'').trim();if(!s||s==='—')return 'A confirmar no projeto';let flagged=/[?†]/.test(s);let clean=s.replace(/[?†]/g,'').trim();return 'Ø '+clean+' mm'+(flagged?' • Conferir diâmetro':'')}
function editCol(code){const c=COLS.find(x=>x.codigo===code);if(!c)return;const p=c.pranchas.map(id=>PROJECTS.find(z=>z.id===id)).filter(Boolean);const uncertain=/[?†—]/.test(c.diametro);const blocks=p.length?p.map(k=>'<div class="project-link"><div><strong>'+safe(k.nome)+'</strong><small>ESG-'+safe(k.id)+' • Revisão '+safe(k.revisao)+'</small></div><a class="btn alt" target="_blank" rel="noopener" href="'+safe(k.url)+'">Abrir PDF ↗</a></div>').join(''):'<p class="muted">Nenhum pavimento registrado para esta coluna.</p>';const note=localStorage.getItem(PKEY+'amb_'+code)||'';let el=document.getElementById('columnModal');if(!el){el=document.createElement('div');el.id='columnModal';el.className='modal-shell';document.body.appendChild(el)}el.innerHTML='<div class="modal-shade" onclick="closeCol()"></div><section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="columnModalTitle"><div class="modal-top"><span class="pill">FICHA DA COLUNA</span><button class="close-modal" aria-label="Fechar" onclick="closeCol()">✕</button></div><h2 id="columnModalTitle">'+safe(c.codigo)+'</h2><div class="modal-data"><div><small>SISTEMA</small><strong>'+safe(c.sistema)+'</strong></div><div><small>DIÂMETRO</small><strong>'+safe(diameterText(c.diametro))+'</strong></div></div>'+(uncertain?'<p class="warn">Diâmetro indicado como preliminar ou não identificado na planilha. Confira a informação no projeto antes da execução.</p>':'')+'<div class="heading"><h3>Projetos onde aparece</h3><span class="pill">'+p.length+' pranchas</span></div><div class="project-list">'+blocks+'</div><div class="note-area"><label for="columnNote">Anotação de conferência neste aparelho</label><textarea id="columnNote" rows="2" placeholder="Ambiente, posição ou observação...">'+safe(note)+'</textarea><div class="actions"><button class="btn alt" onclick="saveColNote(\''+safe(c.codigo)+'\')">Salvar anotação</button><span class="muted" id="noteSaved" aria-live="polite"></span></div></div><p class="muted">Identificações e pavimentos conforme levantamento preliminar. Confira o projeto executivo e sua revisão vigente.</p></section>';el.classList.add('open');document.body.classList.add('modal-open');document.addEventListener('keydown',escCol);el.querySelector('.close-modal').focus()}
function saveColNote(code){localStorage.setItem(PKEY+'amb_'+code,document.getElementById('columnNote').value);document.getElementById('noteSaved').textContent='Anotação salva neste aparelho.'}
function escCol(ev){if(ev.key==='Escape')closeCol()}
function closeCol(){let el=document.getElementById('columnModal');if(el)el.classList.remove('open');document.body.classList.remove('modal-open');document.removeEventListener('keydown',escCol)}

function goQr(id){selected=null;tab='qr';render();let s=document.getElementById('qrSelect');if(s)s.value=id;updateQr()}
function getBase(){return localStorage.getItem(PKEY+'base')||''}function setBase(v){localStorage.setItem(PKEY+'base',v.trim());updateQr()}function validBase(){let v=document.getElementById('baseUrl').value.trim();try{let u=new URL(v);return /^https?:$/.test(u.protocol)&&u.hostname?u.href:null}catch{return null}}function qrUrl(id){let b=validBase();if(!b)return null;let u=new URL(b);u.searchParams.set('p',id);return u.href}
function renderQR(){app.innerHTML=card('<div class="heading"><h2>QR-Codes de acesso</h2><span class="pill">Preparação para impressão</span></div><p class="muted">Depois que o HTML for publicado, cole aqui o endereço <b>público e definitivo do index.html</b>. Os códigos serão criados com um destino exclusivo para cada prancha.</p><label class="muted">URL publicada do portal</label><input class="input mono" id="baseUrl" placeholder="https://seu-dominio/.../index.html" value="'+safe(getBase())+'" oninput="setBase(this.value)"><div style="height:12px"></div><label class="muted">Prancha / pavimento</label><select id="qrSelect" class="input" onchange="updateQr()">'+PROJECTS.map(p=>'<option value="'+p.id+'">'+safe(p.nome)+'</option>').join('')+'</select><div id="qrArea"></div><div class="actions" style="margin-top:10px"><button id="printQr" class="btn" onclick="printQrs()" disabled>🖨 Imprimir todos os QR-Codes</button></div><p class="warn">NÃO encaminhe os QR-Codes para a gráfica antes de publicar e testar o endereço final. Se o site mudar de URL, os adesivos terão de ser refeitos. A direção de leitura depende do acesso à internet e das permissões dos PDFs.</p>');updateQr()}
function loadQRCode(cb){if(window.QRCode){cb();return}let s=document.getElementById('qrjs');if(!s){s=document.createElement('script');s.id='qrjs';s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=cb;s.onerror=()=>{let a=document.getElementById('qrArea');if(a)a.innerHTML='<div class="warn">Não foi possível carregar o gerador de QR. É preciso conexão para gerar os códigos nesta V3. Os projetos continuam acessíveis normalmente.</div>'};document.head.appendChild(s)}else{s.addEventListener('load',cb,{once:true})}}
function updateQr(){let area=document.getElementById('qrArea');if(!area)return;const p=PROJECTS.find(p=>p.id===document.getElementById('qrSelect').value);const u=qrUrl(p.id);let b=document.getElementById('printQr');b.disabled=!u;if(!u){area.innerHTML='<p class="warn">Informe uma URL HTTPS/HTTP completa para gerar o QR-Code definitivo. Nesta fase, o endereço ainda não foi definido.</p>';return}area.innerHTML='<div class="qr-wrap"><div style="font-size:12px;font-weight:800;margin-bottom:10px">'+safe(p.nome)+'</div><div id="qrView"></div><small class="muted">'+safe(u)+'</small></div><p class="ok">Destino configurado. Teste o QR com outro celular antes de mandar imprimir.</p>';loadQRCode(()=>{const target=document.getElementById('qrView');if(target){target.innerHTML='';new QRCode(target,{text:u,width:230,height:230,correctLevel:QRCode.CorrectLevel.H})}})}
async function printQrs(){if(!validBase())return;loadQRCode(()=>{let html='<div class="print-grid">';PROJECTS.forEach(p=>{let u=qrUrl(p.id);html+='<div class="print-label"><div><b>PALAZZO SILVIA FONSECA DINIZ</b><small>ACESSO AO PROJETO HIDROSSANITÁRIO</small><h3>'+safe(p.nome)+'</h3><small>Prancha ESG-'+p.id+' | '+p.revisao+'</small></div><div class="qrc" data-url="'+safe(u)+'"></div></div>'});html+='</div>';let parent=document.getElementById('app');let box=document.getElementById('printHere');if(box)box.remove();box=document.createElement('div');box.id='printHere';box.innerHTML=html;parent.append(box);box.querySelectorAll('.qrc').forEach(el=>new QRCode(el,{text:el.dataset.url,width:130,height:130,correctLevel:QRCode.CorrectLevel.H}));setTimeout(()=>window.print(),300)})}
function renderHelp(){app.innerHTML=card('<h2>Como funciona a V3</h2><p class="muted"><b>1.</b> Cole um QR-Code geral próximo a um conjunto de descidas, não em cada tubo. Os adesivos individuais das colunas continuam independentes.</p><p class="muted"><b>2.</b> Cada QR abre <b>esta página já no pavimento/prancha correspondente</b>, com botão para ver o PDF executivo e a lista de colunas da prancha.</p><p class="muted"><b>3.</b> Ao publicar, envie a pasta <b>projetos</b> com os oito PDFs, sem alterar seus nomes.</p><p class="muted"><b>4.</b> Após definir e testar a URL pública, abra a aba QR-Codes, gere a cartela e só então mande imprimir.</p><div class="warn">Pranchas de pavimento tipo 004/005/006 identificadas como Tipo 03/02/01, respectivamente. A matriz de colunas é preliminar; diâmetros e locais devem ser conferidos. HTML estático publicado publicamente não restringe acesso aos projetos.</div>')}
window.addEventListener('popstate',()=>{let id=new URLSearchParams(location.search).get('p');selected=PROJECTS.find(p=>p.id===id)||null;tab='inicio';render()});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>makeTab(b.dataset.tab)));selected=PROJECTS.find(p=>p.id===qpid)||null;render();</script></body></html>
